blueprint:
  name: Pool Timer Card - Server Enforcement
  description: >
    Drives the pool pump from the same helpers the Pool Timer Card writes, so the
    schedule keeps working even when no dashboard / browser is open.

    It mirrors the card's own decision logic (_computeDesiredState): Auto follows
    the 48-slot schedule, Perm = always on, OFF = always off, a running timed action
    keeps the pump on until its until timestamp, and the flocculant settling lock
    keeps it off until you resume. When a timed action expires it applies the stored
    after behavior (settle / clear) and updates the state helper.

    NOTE: every computed variable is self-contained (it re-derives everything from
    the four entity inputs in a single template scope). Variables that reference
    OTHER computed variables fail to render on some Home Assistant versions and
    silently abort the run - do not refactor them to share intermediate values.
  domain: automation
  source_url: https://github.com/serweck/pool-timer-card/blob/main/blueprints/pool_timer.yaml
  input:
    pump_switch:
      name: Pump switch
      description: The switch entity that powers the pump (card entity).
      selector:
        entity:
          filter:
            - domain: switch
    schedule_helper:
      name: Schedule helper
      description: The input_text holding the 48-char schedule (card schedule_entity).
      selector:
        entity:
          filter:
            - domain: input_text
    mode_helper:
      name: Mode helper
      description: The input_select with Auto / Perm / OFF (card mode_entity).
      selector:
        entity:
          filter:
            - domain: input_select
    state_helper:
      name: State helper
      description: The input_text holding the JSON preset/action state (card state_entity).
      selector:
        entity:
          filter:
            - domain: input_text
    preset_select:
      name: Preset helper (optional)
      description: >
        The input_select whose options are your preset names (card preset_entity).
        Leave empty if you have not moved presets to the server yet.

        When set, selecting an option applies that preset's schedule server-side,
        so automations can switch presets with no dashboard open. The schedule for
        each preset lives in an input_text named "Pool Timer Preset <name>".
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: input_select

# 'restart' so each minute cancels any still-running (e.g. hung switch call) run
# and re-evaluates cleanly. 'single' would silently drop every tick while a prior
# run is stuck, which looks exactly like "the trigger never fires".
mode: restart

trigger:
  # Re-evaluate every minute...
  - platform: time_pattern
    minutes: /1
  # ...and right after a restart so the pump is corrected immediately on boot.
  - platform: homeassistant
    event: start
  # ...and the moment a preset is selected, so the schedule follows immediately.
  #
  # This is edge-triggered on purpose. Checking "does the schedule match the
  # selected preset?" on the minute tick instead would mean that painting a new
  # schedule while the selector still said 'Verano' got reverted a minute later —
  # the blueprint would fight the user. Acting only on a *change* of selection
  # leaves the schedule alone the rest of the time.
  #
  # `preset_select` is a LIST (default []) rather than a single entity because an
  # unset single-entity input renders as an empty entity_id, which is invalid here
  # and would stop the whole automation from loading for everyone who has not
  # migrated. An empty list is accepted and simply never fires.
  - platform: state
    entity_id: !input preset_select
    id: preset_selected

variables:
  # Plain (non-templated) inputs only. Everything else is self-contained below.
  pump: !input pump_switch
  sched_e: !input schedule_helper
  mode_e: !input mode_helper
  state_e: !input state_helper
  preset_list: !input preset_select

  # Desired pump state: running action -> settling -> base mode/schedule.
  desired: >
    {% set raw = states(state_e) %}
    {% set st = raw | from_json if raw.startswith('{') else {} %}
    {% set act = st.action if 'action' in st else none %}
    {% set until = st.until | int(0) %}
    {% set after = st.after if 'after' in st else 'Auto' %}
    {% set mode = states(mode_e) %}
    {% set sched = states(sched_e) %}
    {% set idx = now().hour * 2 + (1 if now().minute >= 30 else 0) %}
    {% set now_ms = (now().timestamp() * 1000) | int %}
    {% set running = (act is number) and (now_ms < until) %}
    {% set expired = (act is number) and (now_ms >= until) %}
    {% set settling = (act == 'settling') or (expired and after == 'OFF') %}
    {{ 'on' if running else ('off' if settling else ('on' if mode == 'Perm' else ('off' if mode == 'OFF' else ('on' if (sched | length == 48 and sched[idx] == '1') else 'off')))) }}

  # A timed action just expired and should lock OFF (flocculant settling).
  to_settling: >
    {% set raw = states(state_e) %}
    {% set st = raw | from_json if raw.startswith('{') else {} %}
    {% set act = st.action if 'action' in st else none %}
    {% set until = st.until | int(0) %}
    {% set after = st.after if 'after' in st else 'Auto' %}
    {% set now_ms = (now().timestamp() * 1000) | int %}
    {{ (act is number) and (now_ms >= until) and (after == 'OFF') }}

  # A timed action just expired and should clear/return (treatment).
  to_clear: >
    {% set raw = states(state_e) %}
    {% set st = raw | from_json if raw.startswith('{') else {} %}
    {% set act = st.action if 'action' in st else none %}
    {% set until = st.until | int(0) %}
    {% set after = st.after if 'after' in st else 'Auto' %}
    {% set now_ms = (now().timestamp() * 1000) | int %}
    {{ (act is number) and (now_ms >= until) and (after != 'OFF') }}

  # New JSON when transitioning to settling.
  new_state_settling: >
    {% set raw = states(state_e) %}
    {% set st = raw | from_json if raw.startswith('{') else {} %}
    {{ {'preset': st.preset if 'preset' in st else none, 'action': 'settling',
        'until': 0, 'ret': st.ret if 'ret' in st else 'Auto', 'after': 'OFF'} | to_json }}

  # New JSON when clearing/returning after a treatment.
  new_state_clear: >
    {% set raw = states(state_e) %}
    {% set st = raw | from_json if raw.startswith('{') else {} %}
    {% set after = st.after if 'after' in st else 'Auto' %}
    {% set preset = st.preset if 'preset' in st else none %}
    {{ {'preset': (after if after != 'Auto' else preset), 'action': none,
        'until': 0, 'ret': st.ret if 'ret' in st else 'Auto', 'after': 'Auto'} | to_json }}

action:
  # 0) A preset was selected: expand it into the schedule helper.
  #
  # Self-contained like every other template here: it re-derives everything from
  # the plain inputs. Do not refactor it to share intermediate variables — the
  # note at the top of this file is not decoration.
  #
  # Guards, each of which prevents a way this could wreck the pump's schedule:
  #   - only on the preset trigger, never on the minute tick
  #   - 'Custom' is not a preset, it is the absence of a match: no-op
  #   - the helper is found by friendly name, because the entity_id of a helper is
  #     not derivable from anything (verified: a helper whose collection id is
  #     "integracionalarmaajax" lives at input_select.integracion_alarma_ajax)
  #   - it must be exactly 48 characters of 0/1. A freshly created or half-typed
  #     helper would otherwise be applied to the pump verbatim
  #   - and it must actually differ, so this never ping-pongs with the card
  - choose:
      - conditions:
          - condition: trigger
            id: preset_selected
          - condition: template
            value_template: >
              {% set pl = preset_list %}
              {% set pe = (pl | first) if (pl is iterable and pl is not string and pl | count > 0) else (pl if pl is string else '') %}
              {% set sel = states(pe) if pe else '' %}
              {% set bits = states.input_text
                   | selectattr('attributes.friendly_name', 'defined')
                   | selectattr('attributes.friendly_name', 'eq', 'Pool Timer Preset ' ~ sel)
                   | map(attribute='state') | list | first | default('') %}
              {{ pe != '' and sel not in ['', 'Custom', 'unknown', 'unavailable']
                 and bits is match('^[01]{48}$') and bits != states(sched_e) }}
        sequence:
          - service: input_text.set_value
            target:
              entity_id: !input schedule_helper
            data:
              value: >
                {% set pl = preset_list %}
                {% set pe = (pl | first) if (pl is iterable and pl is not string and pl | count > 0) else (pl if pl is string else '') %}
                {% set sel = states(pe) if pe else '' %}
                {{ states.input_text
                     | selectattr('attributes.friendly_name', 'defined')
                     | selectattr('attributes.friendly_name', 'eq', 'Pool Timer Preset ' ~ sel)
                     | map(attribute='state') | list | first | default('') }}

  # 1) Persist any just-expired timed-action transition back into the state helper.
  - choose:
      - conditions: "{{ to_settling }}"
        sequence:
          - service: input_text.set_value
            target:
              entity_id: !input state_helper
            data:
              value: "{{ new_state_settling }}"
      - conditions: "{{ to_clear }}"
        sequence:
          - service: input_text.set_value
            target:
              entity_id: !input state_helper
            data:
              value: "{{ new_state_clear }}"

  # 2) Enforce the pump state (idempotent - only acts when it differs).
  - choose:
      - conditions: "{{ desired | trim == 'on' and not is_state(pump, 'on') }}"
        sequence:
          - service: switch.turn_on
            target:
              entity_id: !input pump_switch
      - conditions: "{{ desired | trim == 'off' and not is_state(pump, 'off') }}"
        sequence:
          - service: switch.turn_off
            target:
              entity_id: !input pump_switch
